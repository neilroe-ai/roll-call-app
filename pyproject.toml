[project]
name = "roll-call-app"
version = "0.0.0"
description = "Roll call app"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roll_call"]

# ----------------------------------------------------------------------
# Ruff: linter + formatter. C90 = mccabe complexity (rule C901).
# ----------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# ----------------------------------------------------------------------
# Mypy: lenient baseline everywhere, STRICT on the domain (core) layer.
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "roll_call.domain.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
strict_equality = true
extra_checks = true

# ----------------------------------------------------------------------
# Pytest + coverage. Coverage floor lives here and nowhere else.
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["roll_call"]

[tool.coverage.report]
fail_under = 70
show_missing = true
